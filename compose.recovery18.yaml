name: fasemarketplace-recovery18

# Independent disposable recovery cluster. Never merge into app/Production Composes.
services:
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_DB: fm_auth_test_recovery
      POSTGRES_USER: fm_recovery_owner
      POSTGRES_PASSWORD: ${RECOVERY_POSTGRES_PASSWORD:?Set a private recovery-only password}
    volumes:
      - recovery18_data:/var/lib/postgresql
    networks: [recovery]
    restart: "no"
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  recovery18_data:
networks:
  recovery:
    internal: true
